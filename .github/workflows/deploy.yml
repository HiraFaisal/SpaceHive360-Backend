name: Deploy SpaceHive360 Backend

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create .env on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            mkdir -p /app/spacehive
            echo "PostgreConnection=${{ secrets.POSTGRES_CONNECTION }}" > /app/spacehive/.env
            echo "ASPNETCORE_ENVIRONMENT=Production" >> /app/spacehive/.env

      - name: Copy code to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          source: "."
          target: "/app/spacehive"

      - name: Deploy with Docker
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /app/spacehive
            docker-compose down
            docker-compose up -d --build
